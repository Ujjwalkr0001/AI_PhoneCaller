name: Deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # fly.toml release_command migrates against this environment's own DATABASE_URL secret.
      - run: flyctl deploy --remote-only --app "$FLY_APP"
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}", FLY_APP: "${{ vars.FLY_APP }}" }
      - run: curl --fail --retry 5 --retry-delay 3 "$BASE_URL/readyz"
        env: { BASE_URL: "${{ vars.PUBLIC_BASE_URL }}" }
  prod:
    needs: staging
    runs-on: ubuntu-latest
    environment: prod # Configure required reviewers in GitHub; YAML cannot enforce that account setting.
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app "$FLY_APP"
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}", FLY_APP: "${{ vars.FLY_APP }}" }
      - run: curl --fail --retry 5 --retry-delay 3 "$BASE_URL/readyz"
        env: { BASE_URL: "${{ vars.PUBLIC_BASE_URL }}" }
